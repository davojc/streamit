[package]
name = "streamit-atem"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
streamit-core = { path = "../streamit-core" }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["net", "time", "sync", "rt", "macros"] }
tracing = { workspace = true }
md-5 = "0.10"

# Not "probe": the VideoHub and Web Presenter crates already have examples named probe, and
# same-named examples in one workspace overwrite each other in target/debug/examples (on
# Windows the parallel links then fail with LNK1104).
[[example]]
name = "atem-probe"
path = "examples/probe.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["net", "time", "sync", "rt", "rt-multi-thread", "macros", "test-util"] }
