[package]
name = "streamit-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "streamit"
path = "src/main.rs"

[features]
# Real GStreamer playout and NDI counter (R5). Without it the DeckLink and NDI are Down stand-ins.
gst = ["streamit-playout/gst"]

[dependencies]
streamit-core = { path = "../streamit-core" }
streamit-atem = { path = "../streamit-atem" }
streamit-videohub = { path = "../streamit-videohub" }
streamit-webpresenter = { path = "../streamit-webpresenter" }
streamit-youtube = { path = "../streamit-youtube" }
streamit-playout = { path = "../streamit-playout" }
streamit-deck = { path = "../streamit-deck" }
streamit-sim = { path = "../streamit-sim" }
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
url = "2"
eframe = "0.37.0"
mdns-sd = "0.21.6"
rfd = "0.17.2"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[dev-dependencies]
streamit-core = { path = "../streamit-core", features = ["fakes"] }
tokio = { workspace = true, features = ["full", "test-util"] }
