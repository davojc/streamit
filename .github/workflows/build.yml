# Runs on every push to main. Tests first; only if they pass, and only when the version in
# Cargo.toml has not been released yet, builds the two Windows exes and publishes them as
# release v<version> (StreamIt's Settings › Updates installs from the latest release):
#   streamit-windows-x64-playout.exe  with GStreamer (DeckLink playout, NDI counter): the playout PC
#   streamit-windows-x64.exe          without GStreamer: any other PC
# To release: raise `version` in Cargo.toml and push to main.
name: Build and release

on:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: rustfmt, clippy
      # Caches the registry and the compiled dependencies; only StreamIt's own crates
      # rebuild when nothing in Cargo.lock changed.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Built against 1.26; the playout PC needs a GStreamer 1.24+ runtime.
      GST_VERSION: "1.26.7"
      GST_ROOT: 'C:\Program Files\gstreamer\1.0\msvc_x86_64'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Is this version released yet?
        id: version
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $v = ($meta.packages | Where-Object name -eq 'streamit-app').version
          "tag=v$v" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          gh release view "v$v" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "v$v is already released; raise the version in Cargo.toml to release again."
            "skip=true" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          } else {
            "skip=false" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          }
          exit 0

      - uses: dtolnay/rust-toolchain@1.98
        if: steps.version.outputs.skip == 'false'
      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.skip == 'false'
        with:
          shared-key: release

      - name: Cache the GStreamer installers
        if: steps.version.outputs.skip == 'false'
        id: gst-cache
        uses: actions/cache@v4
        with:
          path: gst-msi
          key: gst-msi-${{ env.GST_VERSION }}

      - name: Download GStreamer
        if: steps.version.outputs.skip == 'false' && steps.gst-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force gst-msi | Out-Null
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc"
          foreach ($f in "gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.msi", "gstreamer-1.0-devel-msvc-x86_64-$env:GST_VERSION.msi") {
            Invoke-WebRequest "$base/$f" -OutFile "gst-msi/$f"
          }

      - name: Install GStreamer
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        run: |
          foreach ($msi in Get-ChildItem gst-msi/*.msi) {
            $p = Start-Process msiexec -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', 'ADDLOCAL=ALL' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$($msi.Name) failed to install ($($p.ExitCode))" }
          }
          if (-not (Test-Path "$env:GST_ROOT\lib\pkgconfig\gstreamer-1.0.pc")) { throw "GStreamer is not in $env:GST_ROOT" }
          "$env:GST_ROOT\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "PKG_CONFIG_PATH=$env:GST_ROOT\lib\pkgconfig" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          if (Test-Path "$env:GST_ROOT\bin\pkg-config.exe") {
            "PKG_CONFIG=$env:GST_ROOT\bin\pkg-config.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          } else {
            choco install pkgconfiglite -y --no-progress
            "PKG_CONFIG=C:\ProgramData\chocolatey\bin\pkg-config.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          }

      - name: Build
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          cargo build -p streamit-app --release --locked
          Copy-Item target/release/streamit.exe dist/streamit-windows-x64.exe
          cargo build -p streamit-app --release --locked --features gst
          Copy-Item target/release/streamit.exe dist/streamit-windows-x64-playout.exe

      - name: Publish the release
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        run: |
          gh release create "${{ steps.version.outputs.tag }}" --target "${{ github.sha }}" `
            dist/streamit-windows-x64-playout.exe dist/streamit-windows-x64.exe `
            --title "StreamIt ${{ steps.version.outputs.tag }}" --generate-notes
