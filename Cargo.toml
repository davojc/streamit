[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
async-trait = "0.1"
thiserror = "2"
tokio-util = "0.7"
tracing = "0.1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "rt-multi-thread"] }
